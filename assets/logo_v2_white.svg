<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="wbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf4ff"/>
    </linearGradient>
    <linearGradient id="wline" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="55%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>
    <filter id="wglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="whadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#005e8c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="190" height="190" rx="44" fill="url(#wbg)"/>
  <rect x="6" y="6" width="188" height="188" rx="43" fill="none" stroke="#b9d8f5" stroke-opacity="0.6" stroke-width="2"/>

  <!-- 淡雷达环 -->
  <circle cx="100" cy="94" r="60" fill="none" stroke="#4db8e8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- 折线:蓝→青 -->
  <path d="M 50 150 L 82 124 L 116 140 L 142 102"
        fill="none" stroke="url(#wline)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#whadow)"/>

  <!-- 命中点:青色星 + 蓝芯 -->
  <circle cx="142" cy="102" r="12" fill="#00e5ff" fill-opacity="0.2"/>
  <circle cx="142" cy="102" r="8" fill="#00e5ff" filter="url(#wglow)"/>
  <circle cx="142" cy="102" r="3" fill="#004d8a"/>

  <!-- 起点蓝色小点 -->
  <circle cx="50" cy="150" r="4.5" fill="#1565c0"/>
</svg>
