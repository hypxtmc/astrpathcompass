<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bgGrad" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#1a1f38"/>
      <stop offset="60%" stop-color="#12162a"/>
      <stop offset="100%" stop-color="#0a0d1c"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6bff"/>
      <stop offset="55%" stop-color="#55b6ff"/>
      <stop offset="100%" stop-color="#4ef0ff"/>
    </linearGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="190" height="190" rx="44" fill="url(#bgGrad)"/>

  <!-- 雷达面：极淡大圆环,只留"方向感" -->
  <circle cx="100" cy="94" r="60" fill="none" stroke="#4ef0ff" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="100" cy="94" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- 折线路径：左下起笔 → 两拐 → 右上落到命中点 -->
  <path d="M 50 150 L 82 124 L 116 140 L 142 102"
        fill="none" stroke="url(#lineGrad)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 路径终点 = 命中点 -->
  <circle cx="142" cy="102" r="12" fill="#4ef0ff" fill-opacity="0.18"/>
  <circle cx="142" cy="102" r="8" fill="#4ef0ff" filter="url(#glow)"/>
  <circle cx="142" cy="102" r="3" fill="#eaffff"/>

  <!-- 起点小标记 -->
  <circle cx="50" cy="150" r="4.5" fill="#8a6bff"/>
</svg>
