<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 200 200">
  <defs>
    <!-- 底部纸面冷光 -->
    <radialGradient id="paper" cx="40%" cy="32%" r="90%">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#e8f2fb"/>
    </radialGradient>
    <!-- 金属外环:顶亮底暗双光泽(写实金属) -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2f8fd"/>
      <stop offset="22%" stop-color="#9db4c8"/>
      <stop offset="46%" stop-color="#e6eef6"/>
      <stop offset="62%" stop-color="#69808f"/>
      <stop offset="85%" stop-color="#b9cad8"/>
      <stop offset="100%" stop-color="#8aa0b2"/>
    </linearGradient>
    <!-- 盘面白瓷 -->
    <radialGradient id="face" cx="42%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="78%" stop-color="#f1f8fd"/>
      <stop offset="100%" stop-color="#dbeaf5"/>
    </radialGradient>
    <!-- 主针上叶:青蓝金属棱面 -->
    <linearGradient id="needleHi" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#19c6e8"/>
      <stop offset="50%" stop-color="#0a83cf"/>
      <stop offset="100%" stop-color="#084f8f"/>
    </linearGradient>
    <linearGradient id="needleLo" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#18b7d6"/>
      <stop offset="100%" stop-color="#0866aa"/>
    </linearGradient>
    <!-- 中央铆钉 -->
    <radialGradient id="rivet" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="35%" stop-color="#6f9ab8"/>
      <stop offset="100%" stop-color="#234a6b"/>
    </radialGradient>
    <filter id="dish" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0b3a5c" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- 纸面底色 -->
  <rect x="5" y="5" width="190" height="190" rx="44" fill="url(#paper)"/>

  <!-- 金属外环(宽环,极薄暗缝分隔) -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#metal)" stroke-width="12" filter="url(#dish)"/>
  <circle cx="100" cy="100" r="87.5" fill="none" stroke="#c4d3e0" stroke-width="1" opacity="0.55"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#7a91a3" stroke-width="1" opacity="0.8"/>

  <!-- 白色瓷盘面 -->
  <circle cx="100" cy="100" r="74" fill="url(#face)"/>
  <!-- 盘缘细暗线(写实接缝) -->
  <circle cx="100" cy="100" r="73" fill="none" stroke="#a5bac9" stroke-width="1.1" opacity="0.9"/>

  <!-- 四主刻度:细长方,顶部高光 -->
  <g stroke="#15456b" stroke-linecap="round">
    <line x1="100" y1="33" x2="100" y2="43" stroke-width="3.4"/>
    <line x1="100" y1="157" x2="100" y2="167" stroke-width="3.4"/>
    <line x1="33" y1="100" x2="43" y2="100" stroke-width="3.4"/>
    <line x1="157" y1="100" x2="167" y2="100" stroke-width="3.4"/>
  </g>
  <g stroke="#92b6ce" stroke-width="1" opacity="0.7">
    <line x1="100" y1="34.5" x2="100" y2="42" />
    <line x1="100" y1="158" x2="100" y2="165.5"/>
    <line x1="34.5" y1="100" x2="42" y2="100"/>
    <line x1="158" y1="100" x2="165.5" y2="100"/>
  </g>

  <!-- N 标识 -->
  <text x="100" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#15456b" letter-spacing="0.5">N</text>

  <!-- 刻度花座(浓缩:四个长刻度=主方位,免去22.5度小针) -->
  <g opacity="0.55">
    <line x1="100" y1="45" x2="100" y2="48" stroke="#2f628a" stroke-width="1.4"/>
    <line x1="100" y1="152" x2="100" y2="155" stroke="#2f628a" stroke-width="1.4"/>
    <line x1="45" y1="100" x2="48" y2="100" stroke="#2f628a" stroke-width="1.4"/>
    <line x1="152" y1="100" x2="155" y2="100" stroke="#2f628a" stroke-width="1.4"/>
  </g>

  <!-- 菱形主针(上叶朝NE) 棱面:亮面+暗面 -->
  <g>
    <!-- 针体投影(极轻) -->
    <polygon points="102,102 138,76 138,92 102,102" fill="#06395c" opacity="0.12"/>
    <!-- 上叶:NE 朝向,主亮 -->
    <polygon points="100,100 128,74 140,80.5 116,104 100,100" fill="url(#needleHi)"/>
    <!-- 上叶暗棱(朝里) -->
    <polygon points="140,80.5 136.5,87 114,100 100,100 116,104" fill="url(#needleLo)" opacity="0.85"/>
    <!-- 上叶尖端高光棱 -->
    <polygon points="143.5,77.5 140,80.5 133,83 120,78 128,74" fill="#8ff4ff" opacity="0.55"/>
    <!-- 下叶:白亮,反向(SW),压低对比 -->
    <polygon points="100,100 72,126 60,119.5 84,96 100,100" fill="#eef7fd"/>
    <polygon points="60,119.5 63.5,113 86,100 100,100 84,96" fill="#cfe4f3"/>
    <polygon points="56.5,122.5 60,119.5 67,117 80,122 72,126" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- 中央铆钉 -->
  <circle cx="100" cy="100" r="11" fill="url(#rivet)"/>
  <circle cx="100" cy="100" r="11" fill="none" stroke="#12344f" stroke-width="1.4" opacity="0.65"/>
  <circle cx="96.5" cy="95.8" r="3.2" fill="#ffffff" opacity="0.75"/>
</svg>
