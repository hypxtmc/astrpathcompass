<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg2" cx="40%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#1c1a3e"/>
      <stop offset="60%" stop-color="#141231"/>
      <stop offset="100%" stop-color="#0b091f"/>
    </radialGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d5ef2"/>
      <stop offset="100%" stop-color="#38e1ff"/>
    </linearGradient>
    <filter id="g2" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g3" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="190" height="190" rx="44" fill="url(#bg2)"/>

  <!-- 缺环：270° 圆环,缺口向 NE -->
  <g transform="rotate(135 100 100)">
    <path d="M 100 30 A 70 70 0 1 1 33.8 65.2"
          fill="none" stroke="url(#arcGrad)" stroke-width="7"
          stroke-linecap="round"/>
    <path d="M 100 36 A 64 64 0 1 1 40.7 68.8"
          fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.4"/>
  </g>

  <!-- 缺口端点：箭头实心三角,指向命中 -->
  <polygon points="136.2,142 120,130.5 133.5,119.5" fill="#38e1ff" filter="url(#g2)"/>

  <!-- 中心固定点 -->
  <circle cx="100" cy="100" r="9.5" fill="#151133" stroke="#8a6bff" stroke-opacity="0.85" stroke-width="2.4"/>
  <circle cx="100" cy="100" r="4" fill="#38e1ff" filter="url(#g3)"/>
</svg>
