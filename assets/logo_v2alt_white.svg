<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="wbg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f4ff"/>
    </linearGradient>
    <linearGradient id="warc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>
    <filter id="wglow2" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="190" height="190" rx="44" fill="url(#wbg2)"/>
  <rect x="6" y="6" width="188" height="188" rx="43" fill="none" stroke="#b9d8f5" stroke-opacity="0.6" stroke-width="2"/>

  <!-- 缺环 270° -->
  <g transform="rotate(135 100 100)">
    <path d="M 100 30 A 70 70 0 1 1 33.8 65.2"
          fill="none" stroke="url(#warc)" stroke-width="7"
          stroke-linecap="round"/>
  </g>

  <!-- 缺口箭头:青 -->
  <polygon points="136.2,142 120,130.5 133.5,119.5" fill="#00bcd4" filter="url(#wglow2)"/>

  <!-- 中心:蓝环 + 青点 -->
  <circle cx="100" cy="100" r="9.5" fill="#ffffff" stroke="#1565c0" stroke-opacity="0.9" stroke-width="2.4"/>
  <circle cx="100" cy="100" r="4" fill="#00e5ff" filter="url(#wglow2)"/>
</svg>
