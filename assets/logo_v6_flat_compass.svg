<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 200 200">
  <!-- 白底圆卡 -->
  <rect x="5" y="5" width="190" height="190" rx="44" fill="#ffffff" stroke="#d9e9f7" stroke-width="1.5"/>

  <!-- 主表环 -->
  <circle cx="100" cy="100" r="79" fill="none" stroke="#0e5a8f" stroke-width="3.4"/>
  <!-- 内辅助细环 -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#86b7d9" stroke-width="1"/>

  <!-- 四主方位刻度:深蓝粗 -->
  <g stroke="#0e5a8f" stroke-linecap="round">
    <line x1="100" y1="24" x2="100" y2="33" stroke-width="3.2"/>
    <line x1="100" y1="167" x2="100" y2="176" stroke-width="3.2"/>
    <line x1="24" y1="100" x2="33" y2="100" stroke-width="3.2"/>
    <line x1="167" y1="100" x2="176" y2="100" stroke-width="3.2"/>
  </g>

  <!-- 八方位次刻度:浅蓝细,45°间隔 -->
  <g stroke="#a9cdec" stroke-linecap="round" transform="rotate(45 100 100)">
    <line x1="100" y1="27" x2="100" y2="32" stroke-width="2"/>
    <line x1="100" y1="168" x2="100" y2="173" stroke-width="2"/>
    <line x1="27" y1="100" x2="32" y2="100" stroke-width="2"/>
    <line x1="168" y1="100" x2="173" y2="100" stroke-width="2"/>
  </g>

  <!-- 方位字母 N / E / S / W -->
  <text x="100" y="19" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0e5a8f">N</text>
  <text x="181" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#86b7d9">E</text>
  <text x="100" y="189" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#86b7d9">S</text>
  <text x="19" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#86b7d9">W</text>

  <!-- 表盘内十字基准线(细,低于针) -->
  <g stroke="#cfddff44" stroke-width="1.6" opacity="0.7">
    <line x1="100" y1="40" x2="100" y2="160"/>
    <line x1="40" y1="100" x2="160" y2="100"/>
  </g>

  <!-- 菱形罗盘针 45° 朝 NE -->
  <polygon points="131.1,68.9 92.0,92.0 108.0,108.0" fill="#10b3d8"/>
  <polygon points="81.6,118.4 92.0,92.0 108.0,108.0" fill="#eaf7fd" stroke="#10b3d8" stroke-width="2"/>

  <!-- 针尾对称配重横线(平衡视觉) -->
  <line x1="94" y1="110" x2="106" y2="110" stroke="#10b3d8" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 中心铆点(双层:外圈+内芯) -->
  <circle cx="100" cy="100" r="6.5" fill="#ffffff" stroke="#0e5a8f" stroke-width="2.6"/>
  <circle cx="100" cy="100" r="2.4" fill="#10b3d8"/>
</svg>
